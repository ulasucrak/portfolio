<svg x="4" y="6" width="56" height="56" viewBox="48 24 204 204">
  <style>.ch-hold,.ch-prop,.ch-cap,.ch-wave,.ch-mouth-neutral,.ch-mouth-talk{display:none}.ch-cheek{opacity:.4}</style><defs>
